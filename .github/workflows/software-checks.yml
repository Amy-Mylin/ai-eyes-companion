name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
# Windows运行器的默认输出编码可能无法表示中文帮助信息。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-host.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_host.py --help
      - run: python run_cm5.py --help
